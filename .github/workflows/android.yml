name: Android CI

on:
  push:
    branches: [ develop ]

jobs:
  build-release:
    name: Generate signed release apk
    runs-on: ubuntu-latest
    environment: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: '/app/keystore/DankChat.jks'
          fileDir: ${{ github.workspace }}
          encodedString: ${{ secrets.SIGNING_KEY }}

      - name: Extract version name
        id: version
        run: |
          base=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          short_sha="${GITHUB_SHA::7}"
          echo "tag=adblock-release" >> "$GITHUB_OUTPUT"
          echo "name=Adblock Fork Release v${base}" >> "$GITHUB_OUTPUT"
          echo "version=${base}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build signed release apk
        run: bash ./gradlew app:assembleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}

      - name: Rename release apk
        run: mv ${{ github.workspace }}/app/build/outputs/apk/release/DankChat-release.apk ${{ github.workspace }}/app/build/outputs/apk/release/DankChat-${{ steps.version.outputs.version }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Signed release apk
          path: ${{ github.workspace }}/app/build/outputs/apk/release/DankChat-${{ steps.version.outputs.version }}.apk

      - name: Update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          REPO: ${{ github.repository }}
        run: |
          apk="${{ github.workspace }}/app/build/outputs/apk/release/DankChat-${VERSION}.apk"

          # Delete existing release for the rolling tag if it exists
          release_id=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id' 2>/dev/null || echo "")
          if [ -n "$release_id" ]; then
            echo "Deleting existing release $release_id"
            gh api -X DELETE "repos/$REPO/releases/$release_id"
          fi

          # Force update the tag to current commit
          git tag -f "$TAG"
          git push origin "$TAG" --force

          notes="**Version:** \`v${VERSION}\`
          **Commit:** [\`${SHORT_SHA}\`](https://github.com/${REPO}/commit/${GITHUB_SHA})
          
          This is a rolling release. The tag \`adblock-release\` always points to the latest build from the \`develop\` branch."

          gh release create "$TAG" "$apk" \
            --repo "$REPO" \
            --title "$RELEASE_NAME" \
            --notes "$notes" \
            --latest
